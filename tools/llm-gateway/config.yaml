# Gateway config. See docs/adr/0001 and 0002.

# Models live in models.yaml (Managed LiteLLM). docker-compose.vertex.yml mounts
# models.vertex.yaml over it to use Gemini on Vertex AI instead.
include:
  - models.yaml

mcp_servers:
  dbt:
    # dbt-mcp runs as one long-lived process next to LiteLLM, started by entrypoint.sh.
    # It listens on 127.0.0.1 only, so nothing outside the container can reach it (ADR 0003).
    transport: "http"
    url: "http://127.0.0.1:8000/mcp"
    # Every tool call runs `dbt parse` into target/: run them one at a time.
    max_concurrent_requests: 1
    # Without this, only the master key may use the server: virtual keys get a 403 and the
    # Admin UI Playground silently drops the tool. PoC: every Caller may use the dbt tools.
    allow_all_keys: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
