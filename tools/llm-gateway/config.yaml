# Gateway config. See docs/adr/0001 and 0002.

model_list:
  - model_name: gpt-5.6-sol
    litellm_params:
      model: litellm_proxy/gpt-5.6-sol
      api_base: os.environ/MANAGED_LITELLM_URL
      api_key: os.environ/MANAGED_LITELLM_KEY

mcp_servers:
  dbt:
    transport: "stdio"
    # Basename "dbt-mcp" is allowed via LITELLM_MCP_STDIO_EXTRA_COMMANDS (docker-compose.yml).
    command: "/opt/envs/dbt-mcp/.venv/bin/dbt-mcp"
    args: []
    # LiteLLM spawns a new dbt-mcp per call and each call runs `dbt parse` into target/:
    # run them one at a time.
    max_concurrent_requests: 1
    # The child does not inherit the container env, so everything dbt-mcp needs goes here.
    env:
      DBT_PROJECT_DIR: "/srv/checkout/dbt_dwh"
      DBT_PROFILES_DIR: "/opt/gateway/profiles"
      DBT_PATH: "/opt/envs/dbt/.venv/bin/dbt"
      DBT_MCP_ENABLE_TOOLS: "get_lineage_dev,get_node_details_dev,list"
      DO_NOT_TRACK: "1"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"   # else every parse phones home
      DBT_VERSION_CHECK: "false"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
